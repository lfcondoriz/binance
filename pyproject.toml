[project]
name = "binance"
version = "0.1.0"
description = "Herramienta para extraer y procesar datos de la API de Binance"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Tu Nombre", email = "tu.email@example.com"}]
keywords = ["binance", "trading", "api", "cryptocurrency"]
dependencies = []

[project.scripts]
binance = "binance.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binance"]